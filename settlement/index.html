<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>精算明細 | 育英祭2026 らーめん大野家</title>
<style>
:root{
  --bg:#FBF4E8; --bg2:#F2E6D1; --card:#FFFFFF; --line:#F2E6D1; --text:#2A201C; --muted:#8A7A6C;
  --primary:#A3242F; --primary-dark:#7C1C25; --primary-deep:#5C141B; --gold:#C9A24B;
  --green:#4F7942; --red:#C1440E; --tint:#F8ECD6; --shadow:0 6px 18px rgba(92,20,27,0.10);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--text);font-family:'Zen Maru Gothic',-apple-system,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
  font-size:16px;line-height:1.6;font-weight:500;
  background-color:var(--bg);
  background-image:
    radial-gradient(circle at 50% 0, transparent 20%, rgba(163,36,47,0.045) 21%, rgba(163,36,47,0.045) 34%, transparent 35%, transparent 100%),
    radial-gradient(circle at 50% 100%, transparent 20%, rgba(163,36,47,0.045) 21%, rgba(163,36,47,0.045) 34%, transparent 35%, transparent 100%);
  background-size:56px 28px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:rgba(255,255,255,0.9);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.logo-img{display:block;height:40px;width:auto;background:#fff;object-fit:contain;border-radius:10px;border:1px solid var(--line)}
.brand span{font-family:'Yuji Syuku',serif;font-weight:400;font-size:28px;letter-spacing:.06em;color:var(--text)}
.wrap{max-width:720px;margin:0 auto;padding:22px 16px 48px}
.crumb{font-size:20px;margin:4px 0 6px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-weight:900}
.crumb .muted{color:var(--muted);font-weight:700}
.crumb b{font-weight:900;color:var(--primary-dark)}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:2px 12px;font-size:13px;font-weight:800;line-height:1.6}
.pill.open{background:var(--gold);color:#402c00} .pill.done{background:var(--green);color:#fff}
.meta{color:var(--muted);font-size:14px;margin-bottom:18px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;margin-bottom:18px;overflow:hidden;box-shadow:var(--shadow)}
.card h2{margin:0;padding:12px 18px;font-size:14px;font-weight:900;color:var(--primary-dark);background:var(--tint);border-bottom:1px solid var(--line);letter-spacing:.04em}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);font-size:16px}
.row:last-child{border-bottom:0}
.row .l{display:flex;align-items:baseline;gap:10px;min-width:0}
.row .sign{font-family:'JetBrains Mono',monospace;color:var(--green);font-weight:700}
.row .sub{color:var(--muted);font-size:13px;font-weight:700}
.amt{font-family:'JetBrains Mono',monospace;font-weight:700;white-space:nowrap}
.row.total{background:var(--tint);font-weight:900;font-size:18px;color:var(--primary-dark);border-top:2px solid var(--gold)}
.row.total .amt{font-size:24px}
.body{padding:18px}
.body p{margin:0 0 14px}
.check{display:flex;gap:12px;align-items:flex-start;padding:14px;border:2px solid var(--line);border-radius:14px;margin-bottom:16px;cursor:pointer;background:var(--bg)}
.check input{width:26px;height:26px;margin-top:1px;flex:none;accent-color:var(--primary)}
label.f{display:block;font-size:14px;font-weight:900;margin-bottom:6px;color:var(--primary-dark)}
input[type=text]{width:100%;padding:14px;font-size:17px;font-family:inherit;border:2px solid var(--line);border-radius:14px;background:var(--bg);color:var(--text)}
input[type=text]:focus{outline:none;border-color:var(--primary)}
.hint{font-size:13px;color:var(--muted);margin:6px 0 16px}
button{font:inherit;cursor:pointer}
.btn{display:block;width:100%;min-height:56px;padding:12px;border:none;border-radius:16px;background:var(--primary);color:#fff;font-size:18px;font-weight:900;letter-spacing:.08em;box-shadow:0 4px 0 var(--primary-deep)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--primary-deep)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{display:inline-block;width:auto;min-height:42px;padding:6px 16px;font-size:14px;font-weight:800;letter-spacing:0;background:var(--card);color:var(--primary-dark);border:2px solid var(--line);border-radius:12px;box-shadow:none}
.btn.sm.danger{color:var(--red)}
.err{margin-top:12px;padding:10px 14px;border-radius:12px;background:#FCE9DF;color:var(--red);font-size:14px;font-weight:700;display:none}
.signed{display:flex;gap:14px;align-items:flex-start;padding:18px;background:#EEF4EA}
.signed .ic{width:40px;height:40px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.signed .nm{font-weight:900;font-size:17px;color:var(--green)}
.signed .at{color:var(--muted);font-size:14px;font-weight:700}
.note{font-size:13px;color:var(--muted)}
.admin-row{padding:14px 18px;border-bottom:1px solid var(--line)}
.admin-row:last-child{border-bottom:0}
.admin-row .top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.admin-row .nm{font-weight:900}
.admin-row .acts{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:800;border-radius:999px;padding:2px 10px;background:var(--bg2);color:var(--muted)}
.tag.ok{background:var(--green);color:#fff}
.center{text-align:center;padding:60px 16px}
</style>
</head>

<div class="wrap" id="app"></div>

<script>
var API = 'https://script.google.com/macros/s/AKfycbzJXaYSa6IvcIJpUu60tcWTAJXLzNPOt_U41R0rYM8GuT0GVfmQazANQEQ_R0OWwS-9/exec';
var T = new URLSearchParams(location.search).get('t') || '';
var PAGE = { mode: 'loading' };
function api(body){
  return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
    .then(function(r){ return r.json(); });
}
(function(){ var l = document.createElement('link'); l.rel = 'stylesheet';
  l.href = 'https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Zen+Maru+Gothic:wght@500;700;900&family=JetBrains+Mono:wght@500;700&display=swap';
  document.head.appendChild(l); })();
var app = document.getElementById('app');

function yen(n){ return '¥' + Number(n).toLocaleString('ja-JP'); }
function el(tag, cls, text){
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function spaced(name){ return name.split('　').join(' '); }

function renderInvalid(){
  var d = el('div','center');
  d.appendChild(el('div','', 'このリンクは無効です。'));
  d.appendChild(el('div','note','届いたリンクをもう一度開いてください。'));
  app.appendChild(d);
}

function statusPill(signed){
  return signed ? el('span','pill done','署名済み') : el('span','pill open','確認待ち');
}

function renderPerson(){
  var p = PAGE.person;
  app.textContent = '';

  var crumb = el('div','crumb');
  crumb.appendChild(el('span','muted','精算明細 /'));
  crumb.appendChild(el('b','', spaced(p.name)));
  var pillBox = el('span'); pillBox.appendChild(statusPill(!!PAGE.sig));
  crumb.appendChild(pillBox);
  app.appendChild(crumb);
  app.appendChild(el('div','meta','2026.10.24 – 10.25　育英祭　らーめん大野家'));

  // 明細
  var card = el('div','card');
  card.appendChild(el('h2','','明細'));
  var r = el('div','row');
  var l = el('div','l'); l.appendChild(el('span','sign','+')); l.appendChild(el('span','','配当金'));
  r.appendChild(l); r.appendChild(el('span','amt',yen(p.dividend)));
  card.appendChild(r);
  for (var i = 0; i < p.expenses.length; i++){
    var ex = p.expenses[i];
    var rr = el('div','row');
    var ll = el('div','l');
    ll.appendChild(el('span','sign','+'));
    ll.appendChild(el('span','','立替経費の返金'));
    ll.appendChild(el('span','sub', ex.item));
    rr.appendChild(ll); rr.appendChild(el('span','amt',yen(ex.refund)));
    card.appendChild(rr);
  }
  var tot = el('div','row total');
  tot.appendChild(el('span','','お受け取り合計'));
  tot.appendChild(el('span','amt',yen(p.total)));
  card.appendChild(tot);
  if (p.expenses.length){
    var nt = el('div','row'); nt.style.display = 'block';
    nt.appendChild(el('span','note','※ 立替経費は、提出していただいた金額を500円単位で繰り上げた金額で返金しています。'));
    card.appendChild(nt);
  }
  app.appendChild(card);

  // 署名
  var sc = el('div','card');
  sc.appendChild(el('h2','','確認と署名'));
  if (PAGE.sig){
    var s = el('div','signed');
    s.appendChild(el('div','ic','✓'));
    var b = el('div');
    b.appendChild(el('div','nm', spaced(PAGE.sig.name) + ' さんが署名しました'));
    b.appendChild(el('div','at', PAGE.sig.at + '　合計 ' + yen(PAGE.sig.total)));
    s.appendChild(b);
    sc.appendChild(s);
  } else {
    var body = el('div','body');
    body.appendChild(el('p','','上の明細(配当金・立替経費の返金)の内容と金額を確認し、間違いがなければ署名してください。'));
    var chk = el('label','check');
    var cb = document.createElement('input'); cb.type = 'checkbox'; cb.id = 'agree';
    chk.appendChild(cb);
    chk.appendChild(el('span','','明細の内容を確認し、' + yen(p.total) + ' を受け取ることに同意します。'));
    body.appendChild(chk);
    var lb = el('label','f','氏名(署名)'); lb.setAttribute('for','nm');
    body.appendChild(lb);
    var inp = document.createElement('input'); inp.type = 'text'; inp.id = 'nm';
    inp.setAttribute('autocomplete','off'); inp.placeholder = spaced(p.name);
    body.appendChild(inp);
    body.appendChild(el('div','hint','上の欄にご自身の氏名(姓名)を入力してください。スペースは入れても入れなくても構いません。'));
    var btn = el('button','btn','署名する'); btn.type = 'button';
    body.appendChild(btn);
    var err = el('div','err'); err.id = 'err';
    body.appendChild(err);
    sc.appendChild(body);

    btn.onclick = function(){
      err.style.display = 'none';
      btn.disabled = true; btn.textContent = '送信中…';
      api({ action: 'sign', t: p.token, name: inp.value, agreed: cb.checked })
        .then(function(res){
          if (res && res.ok){ PAGE.sig = res.sig; renderPerson(); window.scrollTo(0,0); }
          else { showErr(res && res.msg ? res.msg : '署名できませんでした。'); }
        })
        .catch(function(e){ showErr('通信に失敗しました。もう一度お試しください。'); });
    };
    function showErr(m){
      err.textContent = m; err.style.display = 'block';
      btn.disabled = false; btn.textContent = '署名する';
    }
  }
  app.appendChild(sc);
  app.appendChild(el('div','note','金額に間違いがある場合は、署名せずに坪内までご連絡ください。署名後の変更は管理者が取り消した場合のみ可能です。'));
}

function renderAdmin(){
  app.textContent = '';
  var rows = PAGE.rows;
  var done = 0;
  for (var i = 0; i < rows.length; i++) if (rows[i].sig) done++;
  var crumb = el('div','crumb');
  crumb.appendChild(el('span','muted','管理者 /'));
  crumb.appendChild(el('b','','署名状況'));
  app.appendChild(crumb);
  app.appendChild(el('div','meta', done + ' / ' + rows.length + ' 人が署名済み'));

  var card = el('div','card');
  card.appendChild(el('h2','','メンバー(個別リンクを各自に送ってください)'));
  rows.forEach(function(r){
    var d = el('div','admin-row');
    var top = el('div','top');
    var left = el('div');
    left.appendChild(el('span','nm', spaced(r.name)));
    left.appendChild(el('span','note','　' + yen(r.total)));
    top.appendChild(left);
    top.appendChild(el('span', r.sig ? 'tag ok' : 'tag', r.sig ? '署名済み ' + r.sig.at : '未署名'));
    d.appendChild(top);
    var acts = el('div','acts');
    var cp = el('button','btn sm','リンクをコピー'); cp.type = 'button';
    cp.onclick = function(){
      var done = function(){ cp.textContent = 'コピーしました'; setTimeout(function(){ cp.textContent = 'リンクをコピー'; }, 1500); };
      if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(r.url).then(done, function(){ window.prompt('リンクをコピーしてください', r.url); }); }
      else { window.prompt('リンクをコピーしてください', r.url); }
    };
    acts.appendChild(cp);
    var op = el('a','btn sm','開く'); op.href = r.url; op.target = '_top'; op.style.textDecoration = 'none';
    acts.appendChild(op);
    if (r.sig){
      var rs = el('button','btn sm danger','署名を取り消す'); rs.type = 'button';
      rs.onclick = function(){
        if (!window.confirm(spaced(r.name) + ' さんの署名を取り消しますか?')) return;
        api({ action: 'reset', t: ADMIN, id: r.id })
          .then(function(res){ if (res && res.ok){ PAGE.rows = res.rows; renderAdmin(); } })
          .catch(function(){ window.alert('通信に失敗しました。'); });
      };
      acts.appendChild(rs);
    }
    d.appendChild(acts);
    card.appendChild(d);
  });
  app.appendChild(card);
}

var ADMIN = T;
function show(){
  if (PAGE.mode === 'person') renderPerson();
  else if (PAGE.mode === 'admin') renderAdmin();
  else renderInvalid();
}
app.appendChild(el('div','center','読み込み中…'));
fetch(API + '?action=get&t=' + encodeURIComponent(T))
  .then(function(r){ return r.json(); })
  .then(function(d){ PAGE = d; app.textContent = ''; show(); })
  .catch(function(){ app.textContent = ''; var d = el('div','center'); d.appendChild(el('div','','読み込めませんでした。'));
    d.appendChild(el('div','note','通信状況を確認して、ページを再読み込みしてください。')); app.appendChild(d); });
</script>
</body>
</html>
